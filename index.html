<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b5d4b">
  <title>병원한걸음</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <link rel="stylesheet" href="style.css?v=21">
</head>
<body>
  <header class="topbar">
    <div class="brand">병원<b>한걸음</b></div>
    <div class="top-actions">
      <button id="btn119" class="chip chip-sos" aria-label="119 응급 전화">🚨 119</button>
      <button id="btnSound" class="chip" aria-pressed="true">🔊 소리 켬</button>
      <button id="btnMenu" class="chip chip-menu" aria-label="메뉴 열기">☰ 메뉴</button>
    </div>
  </header>

  <div id="stepbar" class="stepbar" aria-live="polite"></div>

  <main id="main" class="main" aria-live="polite"></main>

  <footer id="dock" class="dock"></footer>

  <!-- 직원에게 보여주는 도움 요청 카드 -->
  <div id="helpCard" class="overlay help" hidden role="dialog" aria-modal="true" aria-label="도움 요청">
    <div class="help-inner">
      <p class="help-small">직원분께 보여 드리세요</p>
      <p id="helpText" class="help-text"></p>
      <div class="row2 help-more"><button id="helpWhere" class="btn btn-light">📷 사진으로 묻기</button><button id="helpLang" class="btn btn-light">🌐 외국어·필담</button></div>
      <button id="helpGuardian" class="btn btn-xl btn-light" hidden>👪 보호자에게 알리기</button>
      <button id="helpClose" class="btn btn-xl btn-light">닫기</button>
    </div>
  </div>

  <!-- 119 응급 -->
  <div id="sos" class="overlay sos" hidden role="dialog" aria-modal="true" aria-label="119 응급 전화">
    <div class="help-inner">
      <p class="sos-title">🚨 많이 아프거나 다치셨나요?</p>
      <a id="call119" class="btn btn-xl btn-sos" href="tel:119">📞 119에 전화하기</a>
      <div class="sos-card">
        <p class="help-small">전화가 연결되면 이렇게 말씀하세요</p>
        <p id="sosScript" class="sos-script"></p>
        <p id="sosLoc" class="sos-loc">📍 위치 찾는 중…</p>
      </div>
      <button id="sosGuardian" class="btn btn-xl btn-light" hidden>👪 보호자에게 알리기</button>
      <button id="sosNear" class="btn btn-xl btn-light">🚑 가까운 응급실 보기</button>
      <button id="sosClose" class="btn btn-light">닫기 (괜찮아요)</button>
    </div>
  </div>

  <!-- 설정 -->
  <div id="settings" class="overlay sheet" hidden role="dialog" aria-modal="true" aria-label="설정">
    <div class="sheet-inner">
      <h2>설정</h2>
      <label class="field">목소리
        <select id="voiceSelect"></select>
      </label>
      <label class="field">말하는 속도 <span id="rateVal"></span>
        <input id="rateInput" type="range" min="0.7" max="1.2" step="0.05">
      </label>
      <label class="field row"><input id="demoToggle" type="checkbox"> 시연 모드 (GPS 없이 걸어가는 것처럼 흉내)</label>
      <label class="field row"><input id="reduceMotion" type="checkbox"> 움직임 줄이기</label>
      <label class="field row"><input id="hfToggle" type="checkbox"> 🎙 말로만 하기 (안내가 끝나면 자동으로 들어요)</label>
      <p id="engineInfo" class="muted"></p>
      <div class="field">🚌 버스 정보 키 (팀원용) <small class="muted" id="busKeyState"></small>
        <input id="busKeyInput" type="password" autocomplete="off" placeholder="공공데이터포털 일반 인증키">
        <div class="row gap"><button id="busKeySave" class="btn btn-light">저장</button><button id="busKeyDel" class="btn btn-light">지우기</button></div>
        <small class="muted">이 휴대폰에만 저장돼요. 다른 사람과 나누지 마세요.</small>
      </div>
      <div class="row gap">
        <button id="testVoice" class="btn btn-light">목소리 들어보기</button>
        <button id="permAgain" class="btn btn-light">위치·마이크 켜기</button>
        <button id="guardianBtn" class="btn btn-light">👪 보호자</button>
        <button id="resetAll" class="btn btn-light">처음부터 다시</button>
      </div>
      <button id="settingsClose" class="btn btn-xl btn-primary">닫기</button>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="config.js?v=21"></script>
  <script src="route.js?v=21"></script>
  <script src="app.js?v=21"></script>
</body>
</html>
